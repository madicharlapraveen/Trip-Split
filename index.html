<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TripSplit - Premium Expense Manager</title>
    <meta name="theme-color" content="#f1f5f9">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon-192.png" type="image/png">
    
    <!-- Tailwind CDN for utility classes used by ui_engine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Link to our super cool new CSS (Loaded after Tailwind to override it) -->
    <link rel="stylesheet" href="css/style.css?v=11">
    <script>window.currentTripId = null;</script>
</head>
<body>

    <!-- Main App Container -->
    <main class="container">
        
        <!-- Persistent Header -->
        <header class="flex justify-between items-center mb-8 animate-fade-in z-40 relative">
            <div class="flex items-center gap-2">
                <div class="btn-icon flex items-center justify-center" style="background: var(--primary-gradient);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TripSplit</h1>
            </div>
            <div id="header-profile" class="btn-icon flex items-center justify-center font-bold text-white shadow-md cursor-pointer hidden" style="background: var(--primary-light);" onclick="showSettings()">
                U
            </div>
        </header>

        <!-- Top Trip Capsules (Injected by JS) -->
        <div id="trips-capsule-container" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2" style="mask-image: linear-gradient(to right, black 85%, transparent 100%);">
            <!-- Dynamically populated by loadTripsCapsules -->
        </div>

        <!-- ================= HOME SCREEN ================= -->
        <section id="home-screen" class="flex-col gap-6 animate-slide-up">
            
            <!-- Super Cool Hero Card -->
            <div class="hero-card glass-card">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <span class="pill">Active Trip</span>
                        <h2 id="current-trip-name" class="text-2xl mt-4 mb-2">No trip selected</h2>
                        <p id="trip-dates" class="text-sm opacity-80">Select or create a trip to start</p>
                    </div>
                    <button class="btn-glass btn-icon flex items-center justify-center" onclick="showEditTripModal()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </button>
                </div>
                
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <p class="text-xs font-bold opacity-80 mb-1" style="text-transform: uppercase;">Total Spent</p>
                        <p id="total-expense" class="text-4xl font-extrabold">₹0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold opacity-80 mb-1" style="text-transform: uppercase;">Budget</p>
                        <p id="display-budget" class="text-xl font-bold">₹0</p>
                    </div>
                </div>

                <div class="flex justify-between items-center" style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 1rem;">
                    <button class="btn-glass text-xs font-bold px-3 py-2 flex items-center gap-2 rounded-xl" onclick="handleCloudSync()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        Cloud Sync
                    </button>
                    <div id="trip-id-pill" class="pill hidden">ID: <span id="display-share-id">---</span></div>
                </div>
            </div>

            <!-- Participants Section -->
            <div class="mt-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg">Crew</h3>
                    <button class="text-sm font-bold" style="color: var(--primary); background: none; border: none; cursor: pointer;" onclick="showAddParticipantModal()">Add New</button>
                </div>
                <div id="participants-list" class="flex gap-4 overflow-x-auto no-scrollbar pb-4" style="mask-image: linear-gradient(to right, black 85%, transparent 100%);">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- Quick Action Card -->
            <button onclick="showScreen('split')" class="w-full glass-card flex justify-between items-center mt-4 border-none text-left" style="cursor: pointer;">
                <div class="flex items-center gap-4">
                    <div class="btn-icon flex items-center justify-center" style="background: rgba(16, 185, 129, 0.1); color: var(--success);">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    <div>
                        <p class="font-bold text-base">Settlement Results</p>
                        <p class="text-xs text-muted">See who owes whom</p>
                    </div>
                </div>
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--text-muted);"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <!-- Budget Progress (Injected by JS) -->
            <div id="budget-progress-container" class="hidden glass-card mt-4">
                <div class="flex justify-between items-center mb-2">
                    <span id="budget-status-text" class="text-xs font-bold uppercase tracking-widest text-slate-500">Budget Progress</span>
                    <span id="budget-percentage" class="text-sm font-bold">0%</span>
                </div>
                <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                    <div id="budget-progress-bar" class="h-full bg-indigo-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <!-- Expense Summary & Details -->
            <div class="grid grid-cols-1 gap-4 mt-6">
                <div class="glass-card">
                    <h3 class="text-lg mb-4">Category Breakdown</h3>
                    <div id="expense-summary" class="flex flex-col gap-4"></div>
                </div>
            </div>

            <div class="glass-card mt-4">
                <h3 class="text-lg mb-4">Recent Expenses</h3>
                <div id="expense-details" class="flex flex-col gap-4"></div>
            </div>

            <!-- Detailed Participants -->
            <div class="glass-card mt-4 mb-8">
                <h3 class="text-lg mb-4">Participant Details</h3>
                <div id="participants-details" class="flex flex-col gap-4"></div>
            </div>
        </section>

        <!-- ================= EXPENSES SCREEN ================= -->
        <section id="expenses-screen" class="hidden flex-col gap-6 animate-slide-up">
            <h2 class="text-2xl">Expenses</h2>
            <div id="expenses-list" class="flex flex-col gap-4"></div>
        </section>

        <!-- ================= PLANNER SCREEN ================= -->
        <section id="plan-screen" class="hidden flex-col gap-6 animate-slide-up">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl">Itinerary</h2>
                <button id="add-place-btn" class="btn" style="background: rgba(79, 70, 229, 0.1); color: var(--primary);" onclick="showAddPlaceModal()">Add Place</button>
            </div>
            <div id="itinerary-list" class="flex flex-col gap-4 relative"></div>
        </section>

        <!-- ================= SPLIT SCREEN ================= -->
        <section id="split-screen" class="hidden flex-col gap-6 animate-slide-up">
            <h2 class="text-2xl">Settlements</h2>
            <div id="split-results" class="flex flex-col gap-4"></div>
        </section>

        <!-- ================= TRIPS SCREEN ================= -->
        <section id="trips-screen" class="hidden flex-col gap-6 animate-slide-up">
            <h2 class="text-2xl">Your Trips</h2>
            <div id="trips-list" class="flex flex-col gap-4"></div>
        </section>

        <!-- ================= OVERLAYS ================= -->
        <div id="modal-overlay" class="modal-overlay">
            <div id="modal-content" class="modal-content"></div>
        </div>
        
        <div id="toast-container" class="fixed top-10 left-1/2 -translate-x-1/2 w-full max-w-sm z-50 flex flex-col gap-2 pointer-events-none px-4"></div>

    </main>

    <!-- Floating Action Button (Global Add) -->
    <button id="fab" class="fab">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- AI Planner Dropdown (Toggled by FAB on Plan screen) -->
    <div id="ai-dropdown" class="hidden fixed z-50 glass-card p-2 flex flex-col gap-2" style="bottom: 180px; right: 24px; border-radius: 20px; min-width: 200px;">
        <button class="w-full text-left p-3 rounded-xl hover:bg-indigo-50 transition-colors font-bold flex items-center gap-2 text-sm text-indigo-700" onclick="askGeminiForPlan()">
            ✨ Get AI Plan
        </button>
        <button class="w-full text-left p-3 rounded-xl hover:bg-emerald-50 transition-colors font-bold flex items-center gap-2 text-sm text-emerald-700" onclick="importGeminiPlan()">
            📥 Paste AI Plan
        </button>
    </div>

    <!-- Super Cool Floating iOS-Style Dock -->
    <nav class="nav-dock">
        <button onclick="showScreen('home')" class="nav-btn nav-active" data-screen="home">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span>Home</span>
        </button>
        <button onclick="showScreen('expenses')" class="nav-btn" data-screen="expenses">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2"></path></svg>
            <span>List</span>
        </button>
        <div style="width: 40px;"></div> <!-- Spacer for FAB to sit above -->
        <button onclick="showScreen('plan')" class="nav-btn" data-screen="plan">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span>Plan</span>
        </button>
        <button onclick="showScreen('trips')" class="nav-btn" data-screen="trips">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Trips</span>
        </button>
    </nav>

    <!-- Core Logic Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js?v=10"></script>
    <script src="js/sync.js?v=10"></script>
    <script src="js/split.js?v=10"></script>
    <script src="js/planner.js?v=10"></script>
    <script src="js/share.js?v=10"></script>
    <script src="js/ai.js?v=10"></script>
    <script src="js/ui_engine.js?v=10"></script>
    <script src="js/app.js?v=10"></script>
</body>
</html>
